[package]
name = "vaultwarden-cf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers
worker = { version = "0.7", features = ["d1"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Crypto - pure Rust implementations (WASM-compatible)
rsa = { version = "0.9", features = ["sha2"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
signature = "2"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
subtle = "2"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
base64 = "0.22"
data-encoding = "2"
hex = "0.4"

# Date/Time
chrono = { version = "0.4", default-features = false, features = ["serde", "wasmbind", "clock"] }

# UUID
uuid = { version = "1", features = ["v4", "js"] }

# MessagePack for SignalR WebSocket protocol
rmpv = "1"

# Console error logging in WASM
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
